<body>

    <!-- Page title -->
    <section class="section page-title">
        <div class="container">
            <h1 class="heading-xl">Get in touch</h1>
            <div class="page-intro">
                <p>Drop me a message and I'll get back to you as soon as I can.</p>
            </div>

        </div>
    </section>

    <section class="section">
        <div class="container">

            <form name="contact" method="POST" data-netlify="true">
                <input type="hidden" name="form-name" value="contact" />

                <div class="form-field">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required />
                </div>

                <div class="form-field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required />
                </div>

                <div class="form-field">
                    <label for="message">How can I help?</label>
                    <textarea id="message" name="message" rows="6" required></textarea>
                </div>

                <button type="submit" class="small-button">Send message</button>
                <div class="toast" id="toast">Thanks for your message — I'll be in touch soon!</div>
            </form>
        </div>
    </section>

    <!-- Footer -->

        <div>

                        LinkedIn
                    </a>
                    <a href="mailto:rich@rich-ux.co.uk" class="footer-link">
                        <img src="assets/icons/email.svg" alt="" />
                        rich@rich-ux.co.uk
                    </a>
                    <a href="assets/rich-williams-cv.pdf" target="_blank" rel="noopener noreferrer" download
                        class="footer-link">
                        <img src="assets/icons/download.png" alt="" />
                        Download CV
